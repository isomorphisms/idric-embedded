name: verify-wasm

on:
  push:
    branches: [wasm-first-executable]
  pull_request:
    branches: [wasm]
  workflow_dispatch:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-core-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Wasm backend
        uses: actions/checkout@v4

      - name: Check out pinned Idriç compiler
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: 081b9cde0591154839fb5d80d76e5570e0436300
          path: Idric

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ca-certificates libgmp-dev python3-venv

      - name: Bootstrap pinned Idriç
        run: ./Idric/edric bootstrap

      - name: Install pinned Idriç libraries and compiler API
        run: |
          make -C Idric install-bootstrap-libs IDRIS2="$GITHUB_WORKSPACE/Idric/build/exec/idris2"
          make -C Idric install-api IDRIS2_BOOT="$GITHUB_WORKSPACE/Idric/build/exec/idris2"

      - name: Generate, inspect, validate, execute, and reproduce module
        run: make verify IDRIC="$GITHUB_WORKSPACE/Idric/build/exec/idris2"
